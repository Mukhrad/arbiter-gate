name: Arbiter Gate DevOps Live Proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executable-routing-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the complete SDK test suite
        run: python -m pytest -q
      - name: Run the executable DevOps routing proof
        run: python examples/devops_live_proof/run_proof.py --output live-proof-artifacts
      - name: Publish decision evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arbiter-gate-decision-evidence
          path: live-proof-artifacts/
          if-no-files-found: error
          retention-days: 30
